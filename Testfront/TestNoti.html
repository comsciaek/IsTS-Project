<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Socket.IO Report Status Update</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f2f5;
    }
    .nav {
      background-color: #262362;
      padding: 10px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav .logo {
      font-size: 20px;
      font-weight: bold;
    }
    .nav .nav-links a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
    }
    .nav .nav-links a:hover {
      text-decoration: underline;
    }
    .bell-container {
      position: relative;
      cursor: pointer;
    }
    .bell-icon {
      font-size: 24px;
    }
    .notification-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background-color: red;
      color: white;
      border-radius: 50%;
      padding: 2px 6px;
      font-size: 12px;
      display: none;
    }
    .container {
      max-width: 600px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 24px;
      color: #1a1a1a;
      text-align: center;
    }
    .status-section {
      margin-bottom: 20px;
    }
    .status-section label {
      font-weight: bold;
      margin-right: 10px;
    }
    .status-section input,
    .status-section select {
      padding: 5px;
      margin-right: 10px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
    }
    .status-section button {
      padding: 6px 12px;
      background-color: #1890ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .status-section button:hover {
      background-color: #40a9ff;
    }
    .notifications {
      border: 1px solid #d9d9d9;
      padding: 10px;
      border-radius: 4px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }
    .notification-item {
      padding: 5px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .notification-item.unread {
      font-weight: bold;
      color: #000;
    }
    .notification-item.read {
      color: #888;
    }
    .notification-item.error {
      color: red;
    }
    .notification-item:last-child {
      border-bottom: none;
    }
    .clear-all {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: #1890ff;
      cursor: pointer;
    }
    .clear-all:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="nav">
    <div class="logo">My App</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Test</a>
      <a href="#">Logout</a>
    </div>
    <div class="bell-container" onclick="toggleNotifications()">
      <i class="fas fa-bell bell-icon"></i>
      <span class="notification-badge" id="notificationCount">0</span>
    </div>
  </div>

  <div class="container">
    <h1>Test Socket.IO Report Status Update</h1>

    <div class="status-section">
      <label for="token">Token:</label>
      <input type="text" id="token" placeholder="Enter your token" style="width: 300px;" value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2N2QwMmJlMmM4ZTQxN2FhNWM5NjkiLCJpYXQiOjE3MTAzOTAwMDB9.ZD6r7nK7gXzH5m6pL8kJ2mN3pL4kJ5mN3pL4kJ5mN3pL4kJ5mN3pL4kJ5mN3pL4kJ5mN3pL4kJ5mN3pL4kJ5mN3pL4kJ5mN3pL" />
      <button onclick="connectSocket()">Connect</button>
    </div>

    <div class="status-section">
      <label for="issueId">Issue ID:</label>
      <input type="text" id="issueId" placeholder="Enter Issue ID" style="width: 150px;" value="67d3c84d2c8e417aa5cb8312" />
      <label for="status" style="margin-left: 20px;">Status:</label>
      <select id="status">
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="completed">Completed</option>
      </select>
      <button onclick="updateStatus()">Update Status</button>
    </div>

    <h2>Notifications</h2>
    <div class="notifications" id="notifications">
      <div class="notification-item">Please connect to the server...</div>
      <div class="clear-all" onclick="clearNotifications()">Clear All</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
  <script>
    let socket = null;
    let notifications = [];
    let unreadCount = 0;

    function connectSocket() {
      const token = document.getElementById('token')?.value;
      if (!token) {
        alert('Please enter a token');
        return;
      }

      if (socket) {
        socket.disconnect();
      }

      socket = io('http://localhost:5000', {
        auth: { token },
        transports: ['websocket', 'polling'],
      });

      socket.on('connect', async () => {
        console.log('Connected to Socket.IO server:', socket.id);
        addNotification('Connected to server');
        await fetchNotifications();
      });

      socket.on('connect_error', (error) => {
        console.error('Connection error:', error.message);
        addNotification(`Connection error: ${error.message}`, true);
      });

      socket.on('reportStatusUpdate', (data) => {
        console.log('Received reportStatusUpdate:', data);
        const message = `Report ${data.issueId}: Status changed from ${data.oldStatus} to ${data.newStatus} - ${data.message}`;
        const notification = {
          id: data.id,
          message,
          isRead: data.isRead,
          createdAt: data.createdAt,
        };
        notifications.push(notification);
        notifications.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        if (!data.isRead) {
          unreadCount++;
        }
        renderNotifications();
        updateNotificationCount();
      });

      socket.on('error', (data) => {
        console.error('Error from server:', data.message);
        addNotification(`Error: ${data.message}`, true);
      });
    }

    async function fetchNotifications() {
      const token = document.getElementById('token')?.value;
      try {
        const response = await fetch('http://localhost:5000/api/notifications', {
          method: 'GET',
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });
        const result = await response.json();
        console.log('Fetched notifications:', result); // ดีบัก
        if (result.data) {
          notifications = result.data.map(notif => ({
            id: notif._id,
            message: `Report ${notif.issueId}: Status changed from ${notif.oldStatus} to ${notif.newStatus} - ${notif.message}`,
            isRead: notif.isRead,
            createdAt: notif.createdAt,
          }));
          notifications.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          unreadCount = notifications.filter(notif => !notif.isRead).length;
          console.log('Processed notifications:', notifications); // ดีบัก
          console.log('Unread count:', unreadCount); // ดีบัก
          renderNotifications();
          updateNotificationCount();
        } else {
          console.error('No data in response:', result);
          addNotification('No notifications found', true);
        }
      } catch (error) {
        console.error('Error fetching notifications:', error);
        addNotification(`Error fetching notifications: ${error.message}`, true);
      }
    }

    function updateStatus() {
      const issueId = document.getElementById('issueId')?.value;
      const status = document.getElementById('status')?.value;
      if (!socket || !socket.connected) {
        alert('Please connect to the server first');
        return;
      }
      if (!issueId || !status) {
        alert('Please enter Issue ID and select a status');
        return;
      }

      socket.emit('reportStatusUpdate', { issueId, status }, (response) => {
        if (response.error) {
          addNotification(`Error: ${response.error}`, true);
        } else {
          addNotification(`Success: Report status updated successfully`);
        }
      });
    }

    function addNotification(message, isError = false) {
      const notification = {
        id: Date.now().toString(),
        message,
        isRead: false,
        createdAt: new Date().toISOString(),
      };
      if (isError) {
        notification.isError = true;
      }
      notifications.push(notification);
      notifications.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      if (!notification.isRead && !isError) {
        unreadCount++;
      }
      renderNotifications();
      updateNotificationCount();
    }

    function renderNotifications() {
      const notificationsDiv = document.getElementById('notifications');
      if (!notificationsDiv) return;
      notificationsDiv.innerHTML = '';
      if (notifications.length === 0) {
        const emptyItem = document.createElement('div');
        emptyItem.className = 'notification-item';
        emptyItem.textContent = 'No notifications';
        notificationsDiv.appendChild(emptyItem);
      } else {
        notifications.forEach((notif) => {
          const notificationItem = document.createElement('div');
          notificationItem.className = 'notification-item';
          if (notif.isError) {
            notificationItem.classList.add('error');
          } else if (notif.isRead) {
            notificationItem.classList.add('read');
          } else {
            notificationItem.classList.add('unread');
          }
          notificationItem.textContent = `[${new Date(notif.createdAt).toLocaleTimeString()}] ${notif.message}`;
          notificationsDiv.appendChild(notificationItem);
        });
      }
      const clearAllDiv = document.createElement('div');
      clearAllDiv.className = 'clear-all';
      clearAllDiv.textContent = 'Clear All';
      clearAllDiv.onclick = clearNotifications;
      notificationsDiv.appendChild(clearAllDiv);
      notificationsDiv.style.display = 'block';
      notificationsDiv.scrollTop = notificationsDiv.scrollHeight;
    }

    async function toggleNotifications() {
      const notificationsDiv = document.getElementById('notifications');
      if (!notificationsDiv) return;

      if (notificationsDiv.style.display === 'none' || notificationsDiv.style.display === '') {
        notificationsDiv.style.display = 'block';
        await markNotificationsAsRead();
      } else {
        notificationsDiv.style.display = 'none';
      }
    }

    async function markNotificationsAsRead() {
      const token = document.getElementById('token')?.value;
      const unreadNotifications = notifications.filter(notif => !notif.isRead && !notif.isError);
      for (const notif of unreadNotifications) {
        try {
          const response = await fetch(`http://localhost:5000/api/notifications/${notif.id}/read`, {
            method: 'PUT',
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });
          const result = await response.json();
          console.log(`Marked notification ${notif.id} as read:`, result); // ดีบัก
          notif.isRead = true;
        } catch (error) {
          console.error('Error marking notification as read:', error);
          addNotification(`Error marking notification as read: ${error.message}`, true);
        }
      }
      unreadCount = 0;
      renderNotifications();
      updateNotificationCount();
    }

    async function clearNotifications() {
      const token = document.getElementById('token')?.value;
      try {
        const response = await fetch('http://localhost:5000/api/notifications/clear', {
          method: 'DELETE',
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });
        const result = await response.json();
        console.log('Cleared notifications:', result); // ดีบัก
        notifications = notifications.filter(notif => notif.isError);
        unreadCount = 0;
        renderNotifications();
        updateNotificationCount();
      } catch (error) {
        console.error('Error clearing notifications:', error);
        addNotification(`Error clearing notifications: ${error.message}`, true);
      }
    }

    function updateNotificationCount() {
      const countElement = document.getElementById('notificationCount');
      if (countElement) {
        countElement.textContent = unreadCount;
        countElement.style.display = unreadCount > 0 ? 'inline' : 'none';
      }
    }

    document.getElementById('notifications').style.display = 'none';
  </script>
</body>
</html>
